[project]
name = "jobmatch"
version = "0.1.0"
description = "Job search assistant for data science: ingestion, skill extraction and CV matching."
readme = "README.md"
authors = [
    { name = "ByteHunter13" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
jobmatch = "jobmatch:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
# Paths are relative to this file, so ruff resolves the same way whether it runs
# from backend/ (CI) or from the repo root (pre-commit hook).
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["jobmatch"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

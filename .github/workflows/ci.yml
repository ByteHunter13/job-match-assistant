# lint + tests
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend    # el pyproject.toml vive aquí
    steps:
      - uses: actions/checkout@v5
      
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 - https://github.com/astral-sh/setup-uv/blob/main/docs/customization.md#format
        with:
          version: "0.3.1"
          checksum: "e11b01402ab645392c7ad6044db63d37e4fd1e745e015306993b07695ea5f9f8"
          working-directory: backend  # lee backend/.python-version
          enable-cache: true          # caché keyed por uv.lock
      
      - name: Install dependencies
        run: uv sync --locked         # falla si uv.lock no coincide con pyproject

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest